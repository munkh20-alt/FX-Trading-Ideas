name: FX ideas (hourly)

on:
  schedule:
    - cron: "7 * * * *"        # цаг тутам (UTC); GitHub заримдаа хэдэн минут хоцроодог
  workflow_dispatch:            # Actions -> Run workflow товчоор гараар

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FXBOT_PUBLIC: "1"
      FXBOT_PRICE_SOURCE: yahoo
      FXBOT_AUTO_MIN: "60"
      PYTHONIOENCODING: utf-8
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore previous reports and data cache
        uses: actions/cache/restore@v4
        with:
          path: |
            cache
            reports
          key: fxbot-${{ github.run_id }}
          restore-keys: fxbot-
      - name: Generate ideas
        run: |
          set +e
          python -m fivers_bot ideas > build.log 2>&1
          echo "ideas exit code: $?" >> build.log
          tail -n 60 build.log
      - name: Export static dashboard
        run: python -m fivers_bot.export_static site
      - name: Save cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            cache
            reports
          key: fxbot-${{ github.run_id }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
